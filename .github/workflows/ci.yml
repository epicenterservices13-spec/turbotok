name: CI

# Pushes to a PR branch are covered by the pull_request trigger; limiting
# push to main keeps each commit from running the job twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # index.html is the deployed bundle; turbotok-site.html is its copy.
      # They are regenerated together, so drift means one was missed.
      - name: Bundle copies are byte-identical
        run: cmp index.html turbotok-site.html
